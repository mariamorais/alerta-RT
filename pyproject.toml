[project]
name = "alerta-rt"
version = "0.1.0"
description = "SAP Notes ingestion + per-client alerting"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "apscheduler>=3.10",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "tenacity>=9.0",
    "lxml>=5.3",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
alerta-rt = "alerta_rt.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alerta_rt"]

[tool.ruff]
line-length = 100
target-version = "py311"
