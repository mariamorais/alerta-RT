services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alerta_rt
      POSTGRES_USER: alerta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alerta}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alerta"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://alerta:${POSTGRES_PASSWORD:-alerta}@db:5432/alerta_rt
    volumes:
      - ./storage:/app/storage
    command: python -m alerta_rt.main

volumes:
  pgdata:
